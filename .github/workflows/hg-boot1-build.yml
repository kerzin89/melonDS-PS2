name: HG-BOOT1 PS2 Build

on:
  push:
    branches:
      - hg-boot1-rom-stream
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current PS2DEV toolchain
        run: |
          sudo mkdir -p /usr/local/ps2dev
          curl -L --fail --retry 3 \
            -o /tmp/ps2dev-latest.tar.gz \
            https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xf /tmp/ps2dev-latest.tar.gz --strip-components 1 -C /usr/local/ps2dev

      - name: Build melonDS-PS2
        env:
          PS2DEV: /usr/local/ps2dev
          PS2SDK: /usr/local/ps2dev/ps2sdk
        run: |
          export PATH="$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin"
          make -j2

      - name: Package AetherSX2 test ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
          mkdir -p dist/iso_root
          cp melonDS.elf dist/melonDS-HG-BOOT1.elf
          cp melonDS.elf dist/iso_root/MELONDS.ELF
          printf 'BOOT2 = cdrom0:\\MELONDS.ELF;1\nVER = 1.00\nVMODE = NTSC\n' > dist/iso_root/SYSTEM.CNF
          genisoimage -quiet -o dist/NDSPS2_HG_BOOT1.iso \
            -V NDSPS2HG1 -iso-level 1 -J -R dist/iso_root
          (cd dist && sha256sum melonDS-HG-BOOT1.elf NDSPS2_HG_BOOT1.iso > SHA256SUMS.txt)

      - name: Upload HG-BOOT1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-PS2-HG-BOOT1
          path: |
            dist/melonDS-HG-BOOT1.elf
            dist/NDSPS2_HG_BOOT1.iso
            dist/SHA256SUMS.txt
          if-no-files-found: error
