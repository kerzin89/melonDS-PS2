name: HGPS2 Stage 1 Build

on:
  push:
    branches: [hg-boot2]
    paths:
      - 'hgps2/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/hgps2.yml'
  pull_request:
    paths:
      - 'hgps2/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/hgps2.yml'
  workflow_dispatch:

jobs:
  host-file-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded native file reads
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -Ihgps2/include hgps2/src/compat.c hgps2/tests/test_file_range.c -o /tmp/hgps2-file-test
          /tmp/hgps2-file-test
      - name: Test NitroFS FAT reads without proprietary ROM
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -Ihgps2/include hgps2/src/compat.c hgps2/src/nitrofs.c hgps2/tests/test_nitrofs.c -o /tmp/hgps2-nitrofs-test
          /tmp/hgps2-nitrofs-test
      - name: Test NARC archive member reads
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -Ihgps2/include hgps2/src/compat.c hgps2/src/nitrofs.c hgps2/src/narc.c hgps2/tests/test_narc.c -o /tmp/hgps2-narc-test
          /tmp/hgps2-narc-test
      - name: Test Nitro graphics signatures
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -Ihgps2/include hgps2/src/compat.c hgps2/src/nitrofs.c hgps2/src/narc.c hgps2/src/resource.c hgps2/tests/test_resource.c -o /tmp/hgps2-resource-test
          /tmp/hgps2-resource-test
      - name: Test bounded LZ10 decoder
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -Ihgps2/include hgps2/src/lz77.c hgps2/tests/test_lz77.c -o /tmp/hgps2-lz10-test
          /tmp/hgps2-lz10-test
  native-runtime:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache make git
      - name: Build native HGPS2 runtime
        working-directory: hgps2
        run: make clean all
      - name: Inspect R5900 ELF
        working-directory: hgps2
        run: |
          file HGPS2.ELF || true
          mips64r5900el-ps2-elf-readelf -h HGPS2.ELF
          mips64r5900el-ps2-elf-size HGPS2.ELF
      - uses: actions/upload-artifact@v4
        with:
          name: HGPS2-native-stage1
          path: |
            hgps2/HGPS2.ELF
            hgps2/iso/SYSTEM.CNF
            hgps2/README.md

  hybrid-bridge:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache make git
      - name: Build legacy hybrid bridge ELF
        run: make clean all
      - name: Inspect hybrid ELF
        run: |
          file melonDS.elf || true
          mips64r5900el-ps2-elf-readelf -h melonDS.elf
          mips64r5900el-ps2-elf-size melonDS.elf
      - uses: actions/upload-artifact@v4
        with:
          name: HGPS2-hybrid-bridge
          path: melonDS.elf
